<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cakes Buddy | Homemade Cakes</title>

    <meta
        name="description"
        content="Cakes Buddy - Homemade cakes baked fresh with love."
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
            background: #fffaf8;
        }

        /* =========================
           COVER
        ========================= */

        .cover {
            position: relative;

            width: 100%;
            height: 100vh;
            height: 100svh;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            background: #fff0f4;
        }

        /* SVG COVER IMAGE */

        .cover-image {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position: center;

            z-index: 1;
        }

        /* LIGHT OVERLAY */

        .cover-overlay {
            position: absolute;

            inset: 0;

            z-index: 2;

            background:
                linear-gradient(
                    180deg,
                    rgba(0, 0, 0, 0.08),
                    rgba(0, 0, 0, 0.18)
                );
        }

        /* CONTENT */

        .cover-content {
            position: relative;

            z-index: 3;

            width: 92%;
            max-width: 700px;

            text-align: center;

            display: flex;
            flex-direction: column;
            align-items: center;

            animation: fadeIn 1.2s ease;
        }

        /* BUTTON */

        .enter-btn {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-width: 220px;

            padding: 16px 32px;

            border-radius: 50px;

            background: #ffffff;

            color: #4b210c;

            border: 0;

            font-size: 16px;
            font-weight: 800;

            text-decoration: none;

            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.22);

            transition:
                transform 0.3s ease,
                background 0.3s ease,
                color 0.3s ease,
                box-shadow 0.3s ease;
        }

        .enter-btn:hover {
            transform: translateY(-5px);

            background: #d9577c;

            color: #ffffff;

            box-shadow:
                0 18px 40px rgba(0, 0, 0, 0.28);
        }

        .enter-btn:active {
            transform: translateY(-1px);
        }

        /* SMALL TEXT */

        .cover-text {
            margin-top: 18px;

            color: #ffffff;

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 1.5px;

            text-transform: uppercase;

            text-shadow:
                0 2px 10px rgba(0, 0, 0, 0.35);
        }

        /* ANIMATION */

        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        /* =========================
           TABLET
        ========================= */

        @media (max-width: 900px) {

            .cover-image {
                object-position: center;
            }

            .enter-btn {
                min-width: 210px;
                padding: 15px 28px;
            }

        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .cover {
                min-height: 100svh;
            }

            .cover-image {
                object-position: center center;
            }

            .cover-overlay {
                background:
                    linear-gradient(
                        180deg,
                        rgba(0, 0, 0, 0.06),
                        rgba(0, 0, 0, 0.20)
                    );
            }

            .cover-content {
                width: 90%;
            }

            .enter-btn {
                min-width: 195px;

                padding: 14px 25px;

                font-size: 15px;
            }

            .cover-text {
                font-size: 10px;

                letter-spacing: 1px;
            }

        }

        /* =========================
           SMALL PHONE
        ========================= */

        @media (max-width: 380px) {

            .enter-btn {
                min-width: 180px;

                padding: 13px 22px;

                font-size: 14px;
            }

            .cover-text {
                margin-top: 14px;
            }

        }

        /* =========================
           LANDSCAPE MOBILE
        ========================= */

        @media (max-height: 500px) {

            .enter-btn {
                padding: 11px 24px;
            }

            .cover-text {
                display: none;
            }

        }

        /* =========================
           ACCESSIBILITY
        ========================= */

        .enter-btn:focus-visible {
            outline: 3px solid #ffffff;
            outline-offset: 5px;
        }

    </style>
</head>

<body>

    <main class="cover">

        <!-- YOUR SVG COVER -->

        <img
            class="cover-image"
            src="https://raw.githubusercontent.com/yourdocuments/products/main/adscoverFrame%201%20(2).svg"
            alt="Cakes Buddy Cover"
        >

        <!-- OVERLAY -->

        <div class="cover-overlay"></div>


        <!-- BUTTON -->

        <div class="cover-content">

            <a
                href="https://whatsapp.com/channel/0029VbD6LlH6RGJJ1QsBN93x"
                class="enter-btn"
                target="_blank"
                rel="noopener noreferrer"
            >
                Enter Website →
            </a>

            <div class="cover-text">
                Fresh • Homemade • Made With Love
            </div>

        </div>

    </main>

</body>
</html>
